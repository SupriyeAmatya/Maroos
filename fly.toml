# Fly.io config. Change `app` to your app's name, then follow DEPLOY.md (fly launch --no-deploy, fly postgres,
# fly storage create, fly secrets set, fly deploy).

app = "maroos"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  Database__MigrateOnStartup = "true"
  # Fly's proxy terminates HTTPS; trust its X-Forwarded-* headers.
  ASPNETCORE_FORWARDEDHEADERS_ENABLED = "true"
  # Email: set Email__From, Email__Smtp__Host, Email__Smtp__Username and Email__Smtp__Password with `fly secrets set` (see DEPLOY.md).
  Email__PublicBaseUrl = "https://maroos.fly.dev"
  Email__Smtp__Port = "587"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: live bidding holds WebSocket connections and the auction closer runs in the app.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
