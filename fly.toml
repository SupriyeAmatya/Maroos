# =====================================================================================================
# FILE: fly.toml
# PURPOSE: Fly.io's app configuration (the alternative to Render). Secrets (database URL, bucket keys,
# GitHub keys) are set with `fly secrets set`, never in this file. DEPLOY.md has the full steps.
# =====================================================================================================
# Fly.io config. Change `app` to your app's name, then follow DEPLOY.md (fly launch --no-deploy, fly postgres,
# fly storage create, fly secrets set, fly deploy).

# The app's name on Fly and the region it runs in ("iad" = Virginia, USA).
app = "maroos"
primary_region = "iad"

# Build with the repository's Dockerfile.
[build]
  dockerfile = "Dockerfile"

# Non-secret environment variables.
[env]
  Database__MigrateOnStartup = "true"
  # Fly's proxy terminates HTTPS; trust its X-Forwarded-* headers.
  ASPNETCORE_FORWARDEDHEADERS_ENABLED = "true"
  # Email: set Email__From, Email__Smtp__Host, Email__Smtp__Username and Email__Smtp__Password with `fly secrets set` (see DEPLOY.md).
  Email__PublicBaseUrl = "https://maroos.fly.dev"
  Email__Smtp__Port = "587"

# How Fly routes web traffic to the app.
[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: live bidding holds WebSocket connections and the auction closer runs in the app.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Health check: GET /health every 30 s (after 30 s of start-up grace).
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Machine size: 512 MB RAM, one shared CPU.
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
