# =====================================================================================================
# FILE: render.yaml
# PURPOSE: A Render.com "Blueprint" — describes the hosting setup as code, so Render can create the
# database and the web service in one go. Secrets are NOT stored here: entries with `sync: false`
# make Render ask for the value in its dashboard.
# =====================================================================================================
# Render Blueprint: a Docker web service plus a PostgreSQL database.
# In Render: New → Blueprint → pick this repository. Fill in the values marked sync: false when asked.
# Plans and regions are left to Render's defaults; set them in the dashboard. See DEPLOY.md.

# A managed PostgreSQL database.
databases:
  - name: maroos-db
    databaseName: maroos
    user: maroos

services:
  # The web app, built from the Dockerfile. Render calls /health to know it's up.
  - type: web
    name: maroos
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # The database's connection string, filled in by Render (a postgres:// URL; DatabaseSetup converts it).
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: maroos-db
          property: connectionString
      # Create/update tables at startup.
      - key: Database__MigrateOnStartup
        value: "true"
      # Render terminates HTTPS in front of the app; trust its X-Forwarded-* headers.
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      # Photos: any S3-compatible bucket (AWS S3, Cloudflare R2, Backblaze B2).
      - key: Uploads__S3__Bucket
        sync: false
      - key: Uploads__S3__ServiceUrl
        sync: false
      - key: Uploads__S3__Region
        sync: false
      - key: Uploads__S3__AccessKey
        sync: false
      - key: Uploads__S3__SecretKey
        sync: false
      # Email: any SMTP provider (Postmark, Brevo, SendGrid, Amazon SES). See DEPLOY.md.
      - key: Email__From
        sync: false
      - key: Email__PublicBaseUrl
        sync: false
      - key: Email__Smtp__Host
        sync: false
      - key: Email__Smtp__Port
        value: "587"
      - key: Email__Smtp__Username
        sync: false
      - key: Email__Smtp__Password
        sync: false
      # Optional GitHub login; leave empty to offer email/password only.
      - key: GitHub__ClientId
        sync: false
      - key: GitHub__ClientSecret
        sync: false
